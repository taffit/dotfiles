add_newline = false
palette = "gruvbox_dark"
format = "$os$username$hostname$directory$git_branch$git_status$fill$cmd_duration$line_break$character"

[palettes.gruvbox_dark]
fg = "#ebdbb2"
bg = "#282828"
blue = "#83a598"
green = "#b8bb26"
red = "#fb4934"
yellow = "#fabd2f"
purple = "#d3869b"
aqua = "#8ec07c"

[os]
disabled = false
style = "bold blue"

[username]
show_always = false
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "bold yellow"
format = "[@$hostname]($style) "

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = false

[git_branch]
symbol = "git:"
style = "bold purple"

[git_status]
style = "bold red"

[fill]
symbol = " "

[cmd_duration]
min_time = 1000
format = "[$duration]($style)"
style = "yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
