# Static expansions use direct native mappings. The final trigger character is
# consumed by the match, so only the preceding characters are erased.


[system = "Windows"]
# Format date
# format_date = $(date +"$0")
# format_date = $(start PowerShell Get-Date -Format "$0")
# trigger["ffdt",  format_date["yyyy-MM-dd"]]

[default]
# Multiline snippets use one sequential keymapperctl process. The waits keep
# character typing, Enter, and the next line from overlapping on Windows.
best_upper = $("${keymapperctl_path}" --type "Best regards," --wait 250 --output Enter --wait 120 --type "David")
best_lower = $("${keymapperctl_path}" --type "best regards," --wait 250 --output Enter --wait 120 --type "David")
mfg_lower  = $("${keymapperctl_path}" --type "mit freundlichen Grüßen" --wait 250 --output Enter --wait 120 --type "David Siller")
mfg_upper  = $("${keymapperctl_path}" --type "Mit freundlichen Grüßen" --wait 250 --output Enter --wait 120 --type "David Siller")
vg_lower   = $("${keymapperctl_path}" --type "viele Grüße" --wait 250 --output Enter --wait 120 --type "David")
vg_upper   = $("${keymapperctl_path}" --type "Viele Grüße" --wait 250 --output Enter --wait 120 --type "David")
kind_upper = $("${keymapperctl_path}" --type "Kind regards," --wait 250 --output Enter --wait 120 --type "David")
kind_lower = $("${keymapperctl_path}" --type "kind regards," --wait 250 --output Enter --wait 120 --type "David")
#  trigger[":time", type[format_date["%H:%M:%S"]]]
#  trigger[":dts",  type[format_date["%Y-%m-%d-%H-%M"]]]

#  trigger[":tel", type[__tel]]

#  trigger[":gm", type[__email1]]
#  trigger[":dm", type[__email2]]
#  trigger[":wm", type[__email3]]
? "//24"  >> repeat[Backspace, 3] "255.255.255.0"
? "//16"  >> repeat[Backspace, 3] "255.255.0.0"
? "//8"   >> repeat[Backspace, 2] "255.0.0.0"
? "192.." >> repeat[Backspace, 4] "192.168."

# Text snippets migrated from QuickAccessPopup.
? "ffBr"  >> ^ repeat[Backspace, 3] 60ms best_upper
? "ffbr"  >> ^ repeat[Backspace, 3] 60ms best_lower
? "ffds"  >> ^ repeat[Backspace, 3] 60ms "David Siller"
? "ffd@"  >> ^ repeat[Backspace, 3] 60ms private_email
? "ffww"  >> ^ repeat[Backspace, 3] 60ms work_email
? "ffmfg" >> ^ repeat[Backspace, 4] 60ms mfg_lower
? "ffMfg" >> ^ repeat[Backspace, 4] 60ms mfg_upper
? "ffvG"  >> ^ repeat[Backspace, 3] 60ms vg_lower
? "ffvg"  >> ^ repeat[Backspace, 3] 60ms vg_lower
? "ffVg"  >> ^ repeat[Backspace, 3] 60ms vg_upper
? "ffVG"  >> ^ repeat[Backspace, 3] 60ms vg_upper
? "fft@"  >> ^ repeat[Backspace, 3] 60ms gmail_email
? "ffKr"  >> ^ repeat[Backspace, 3] 60ms kind_upper
? "ffkr"  >> ^ repeat[Backspace, 3] 60ms kind_lower

# Additional Keymapper-only snippets.
? "ffso"  >> repeat[Backspace, 3] "¯\_(ツ)_/¯"

